<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 8-Ball Pool Pro</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0d12;
            color: #fff;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 25px;
        }

        /* Top Bar Scoreboard */
        .hud-panel {
            background: rgba(12, 16, 26, 0.9);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }

        .player-card.active {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.25), rgba(46, 125, 50, 0.4));
            border: 1px solid #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }

        .player-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .player-type {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
        }

        #timer-box {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff9800;
            min-width: 50px;
            text-align: center;
        }

        /* Power Meter (Kanan) */
        #power-container {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 280px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #power-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #4CAF50, #ffeb3b, #f44336);
            border-radius: 10px;
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            margin: auto;
            width: calc(100% - 8px);
            transition: height 0.05s linear;
        }

        /* Controls Bottom Bar */
        #controls-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(12, 16, 26, 0.95);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        button, select {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover, select:hover {
            background: #1e88e5;
            transform: scale(1.05);
        }

        #notification {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 25px rgba(33, 150, 243, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .ball-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid #fff;
        }
    </style>

    <!-- Three.js (Grafik 3D) & Cannon.js (Fisika Presisi) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="hud-panel">
                <div class="player-card active" id="p1-card">
                    <div>
                        <div class="player-name">Pemain 1</div>
                        <div class="player-type" id="p1-type">Semua Bola</div>
                    </div>
                </div>
                <div class="player-card" id="p2-card">
                    <div>
                        <div class="player-name" id="p2-name">Komputer</div>
                        <div class="player-type" id="p2-type">Semua Bola</div>
                    </div>
                </div>
            </div>

            <div class="hud-panel">
                <div id="timer-box">30</div>
            </div>
        </div>

        <div id="notification">8-BALL POOL</div>

        <div id="controls-bar">
            <select id="mode-select" onchange="setGameMode(this.value)">
                <option value="ai">VS Komputer (AI)</option>
                <option value="pvp">Bermain Berdua (2 Players)</option>
            </select>
            <select id="level-select" onchange="setAiLevel(this.value)">
                <option value="easy">AI: Mudah</option>
                <option value="medium" selected>AI: Sedang</option>
                <option value="hard">AI: Sulit (Master)</option>
            </select>
            <button onclick="toggleCameraView()">Kamera: <span id="cam-mode-text">3D</span></button>
            <button onclick="resetGame()">Reset Game</button>
        </div>

        <div id="power-container">
            <div id="power-bar"></div>
        </div>
    </div>

    <script>
        // --- Web Audio API (Efek Suara Sintetis Realistis) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, intensity = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(Math.min(intensity, 1), audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'pocket') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        // --- Variabel Logika Game ---
        let gameMode = 'ai';
        let aiLevel = 'medium';
        let currentPlayer = 1;
        let playerGroup = { 1: null, 2: null }; // 'solid' atau 'striped'
        let timer = 30;
        let timerInterval = null;

        let aimAngle = 0;
        let power = 0;
        let isChargingPower = false;
        let isAimingWithMouse = false;
        let canShoot = true;
        let cameraMode3D = true;

        // --- Inisialisasi Three.js & Cannon.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08090d);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const light1 = new THREE.SpotLight(0xffffff, 1);
        light1.position.set(0, 25, 0);
        light1.castShadow = true;
        light1.shadow.mapSize.width = 2048;
        light1.shadow.mapSize.height = 2048;
        scene.add(light1);

        // World Physics
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // --- Meja Biliar Standard (Rasio 2:1) ---
        const tableW = 10, tableL = 20;

        // Karpet Meja
        const tableGeo = new THREE.BoxGeometry(tableW, 0.4, tableL);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x0c6838, roughness: 0.3 });
        const tableMesh = new THREE.Mesh(tableGeo, tableMat);
        tableMesh.position.y = -0.2;
        tableMesh.receiveShadow = true;
        scene.add(tableMesh);

        const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(tableW/2, 0.2, tableL/2)) });
        tableBody.position.y = -0.2;
        world.addBody(tableBody);

        // 6 Lubang (Pockets)
        const pocketRadius = 0.65;
        const pockets = [
            { x: -4.6, z: -9.4 }, { x: 4.6, z: -9.4 },
            { x: -4.8, z: 0 },    { x: 4.8, z: 0 },
            { x: -4.6, z: 9.4 },  { x: 4.6, z: 9.4 }
        ];

        pockets.forEach(p => {
            const pGeo = new THREE.CylinderGeometry(pocketRadius, pocketRadius, 0.5, 32);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pMesh.position.set(p.x, -0.01, p.z);
            scene.add(pMesh);
        });

        // Dinding Pembatas (Cushions)
        function createCushion(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, 0.8, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2d1706, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.3, z);
            mesh.castShadow = true;
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w/2, 0.4, d/2)) });
            body.position.set(x, 0.3, z);
            world.addBody(body);
        }

        createCushion(-5.3, 0, 0.6, tableL); // Kiri
        createCushion(5.3, 0, 0.6, tableL);  // Kanan
        createCushion(0, -10.3, tableW, 0.6); // Atas
        createCushion(0, 10.3, tableW, 0.6);  // Bawah

        // --- Bola Biliar (Solid & Striped) ---
        const ballRadius = 0.32;
        const balls = [];
        const ballBodies = [];

        const ballData = [
            { num: 0, color: 0xffffff, type: 'cue' },
            { num: 1, color: 0xffd700, type: 'solid' },  // Yellow
            { num: 2, color: 0x0000ff, type: 'solid' },  // Blue
            { num: 3, color: 0xff0000, type: 'solid' },  // Red
            { num: 4, color: 0x4b0082, type: 'solid' },  // Purple
            { num: 5, color: 0xff8c00, type: 'solid' },  // Orange
            { num: 6, color: 0x008000, type: 'solid' },  // Green
            { num: 7, color: 0x800000, type: 'solid' },  // Maroon
            { num: 8, color: 0x111111, type: '8ball' },  // Black
            { num: 9, color: 0xffd700, type: 'striped' },
            { num: 10, color: 0x0000ff, type: 'striped' },
            { num: 11, color: 0xff0000, type: 'striped' },
            { num: 12, color: 0x4b0082, type: 'striped' },
            { num: 13, color: 0xff8c00, type: 'striped' },
            { num: 14, color: 0x008000, type: 'striped' },
            { num: 15, color: 0x800000, type: 'striped' }
        ];

        function createBall(x, z, info) {
            const geo = new THREE.SphereGeometry(ballRadius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: info.color, roughness: 0.1, metalness: 0.05 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Sphere(ballRadius);
            const body = new CANNON.Body({ mass: 0.8, shape: shape });
            body.position.set(x, ballRadius, z);
            body.linearDamping = 0.3;
            body.angularDamping = 0.3;

            body.addEventListener("collide", (e) => {
                const vel = e.contact.getImpactVelocityAlongNormal();
                if (vel > 0.4) playSound('hit', vel / 8);
            });

            world.addBody(body);
            balls.push({ mesh, body, info });
            ballBodies.push(body);
        }

        // Bola Putih
        createBall(0, 5, ballData[0]);

        // Susunan Triangulasi Bola
        function rackBalls() {
            let idx = 1;
            const startZ = -4;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c <= r; c++) {
                    const x = (c - r / 2) * (ballRadius * 2.1);
                    const z = startZ - (r * ballRadius * 1.9);
                    createBall(x, z, ballData[idx]);
                    idx++;
                }
            }
        }
        rackBalls();

        // --- Visual Stik & Garis Panduan Pembidik Pro ---
        const cueGeo = new THREE.CylinderGeometry(0.05, 0.1, 9, 16);
        const cueMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const cueMesh = new THREE.Mesh(cueGeo, cueMat);
        cueMesh.rotation.x = Math.PI / 2;
        scene.add(cueMesh);

        // Line Proyeksi
        const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.3, gapSize: 0.15 });
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-12)]);
        const aimLine = new THREE.Line(lineGeo, lineMat);
        aimLine.computeLineDistances();
        scene.add(aimLine);

        // --- Input Controller ---
        window.addEventListener('keydown', (e) => {
            if (!canShoot || (gameMode === 'ai' && currentPlayer === 2)) return;

            if (e.code === 'ArrowLeft') aimAngle += 0.03;
            if (e.code === 'ArrowRight') aimAngle -= 0.03;

            if (e.code === 'Space' && !isChargingPower) {
                isChargingPower = true;
                chargePower();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && isChargingPower) {
                isChargingPower = false;
                shoot();
            }
        });

        // Tetapkan Bidikan dengan Mouse
        window.addEventListener('mousemove', (e) => {
            if (!canShoot || (gameMode === 'ai' && currentPlayer === 2)) return;
            if (e.buttons === 1) { // Left Mouse Drag
                aimAngle -= e.movementX * 0.005;
            }
        });

        function chargePower() {
            if (!isChargingPower) return;
            power = (power + 2.5) % 100;
            document.getElementById('power-bar').style.height = power + '%';
            requestAnimationFrame(chargePower);
        }

        function shoot() {
            canShoot = false;
            cueMesh.visible = false;
            aimLine.visible = false;

            const force = (power / 100) * 22;
            const fx = Math.sin(aimAngle) * force;
            const fz = -Math.cos(aimAngle) * force;

            balls[0].body.applyImpulse(new CANNON.Vec3(fx, 0, fz), balls[0].body.position);
            
            power = 0;
            document.getElementById('power-bar').style.height = '0%';

            setTimeout(checkStopped, 2000);
        }

        function checkStopped() {
            const checkInt = setInterval(() => {
                let stopped = true;
                for (let b of ballBodies) {
                    if (b.velocity.length() > 0.04 || b.angularVelocity.length() > 0.04) {
                        stopped = false;
                        break;
                    }
                }

                if (stopped) {
                    clearInterval(checkInt);
                    switchTurn();
                }
            }, 400);
        }

        // --- Manajemen Turn & Aturan 8-Ball ---
        function startTimer() {
            clearInterval(timerInterval);
            timer = 30;
            document.getElementById('timer-box').innerText = timer;

            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer-box').innerText = timer;
                if (timer <= 0) {
                    showNotification("Waktu Habis!");
                    switchTurn();
                }
            }, 1000);
        }

        function switchTurn() {
            clearInterval(timerInterval);
            currentPlayer = currentPlayer === 1 ? 2 : 1;

            document.getElementById('p1-card').classList.toggle('active', currentPlayer === 1);
            document.getElementById('p2-card').classList.toggle('active', currentPlayer === 2);

            canShoot = true;
            cueMesh.visible = true;
            aimLine.visible = true;

            if (gameMode === 'ai' && currentPlayer === 2) {
                showNotification("Giliran Komputer");
                setTimeout(playAI, 1200);
            } else {
                showNotification(`Giliran Pemain ${currentPlayer}`);
                startTimer();
            }
        }

        // --- kecerdasan AI ---
        function playAI() {
            let error = 0;
            if (aiLevel === 'easy') error = (Math.random() - 0.5) * 0.35;
            if (aiLevel === 'medium') error = (Math.random() - 0.5) * 0.12;
            if (aiLevel === 'hard') error = (Math.random() - 0.5) * 0.02;

            let target = balls[1].body;
            for (let i = 1; i < balls.length; i++) {
                if (balls[i].body.position.y > -0.5) {
                    target = balls[i].body;
                    break;
                }
            }

            const dx = target.position.x - balls[0].body.position.x;
            const dz = target.position.z - balls[0].body.position.z;
            aimAngle = Math.atan2(dx, -dz) + error;

            power = aiLevel === 'hard' ? 70 : 50;
            shoot();
        }

        // --- UI & Kamera ---
        function toggleCameraView() {
            cameraMode3D = !cameraMode3D;
            document.getElementById('cam-mode-text').innerText = cameraMode3D ? "3D" : "2D (Atas)";
        }

        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 1800);
        }

        function setGameMode(v) {
            gameMode = v;
            document.getElementById('p2-name').innerText = v === 'ai' ? "Komputer" : "Pemain 2";
            resetGame();
        }

        function setAiLevel(v) {
            aiLevel = v;
        }

        function resetGame() {
            balls[0].body.position.set(0, ballRadius, 5);
            balls[0].body.velocity.set(0, 0, 0);

            currentPlayer = 1;
            document.getElementById('p1-card').classList.add('active');
            document.getElementById('p2-card').classList.remove('active');

            canShoot = true;
            cueMesh.visible = true;
            aimLine.visible = true;

            showNotification("Mulai Game!");
            startTimer();
        }

        // --- Render Loop & Kamera Mengikuti Arah Stik ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);

            // Sinkronkan Fisika dengan Bola Visual
            for (let b of balls) {
                b.mesh.position.copy(b.body.position);
                b.mesh.quaternion.copy(b.body.quaternion);

                // Cek Masuk Lubang (Pockets)
                pockets.forEach(p => {
                    const dist = Math.hypot(b.body.position.x - p.x, b.body.position.z - p.z);
                    if (dist < pocketRadius && b.body.position.y > -0.5) {
                        playSound('pocket');
                        if (b.info.num === 0) { // Cue ball foul
                            showNotification("Foul! Bola Putih Masuk");
                            b.body.position.set(0, ballRadius, 5);
                            b.body.velocity.set(0,0,0);
                        } else {
                            b.body.position.set(100, -10, 0); // Pindahkan keluar
                            b.body.velocity.set(0,0,0);
                        }
                    }
                });
            }

            // Kontrol Posisi Kamera
            const cuePos = balls[0].mesh.position;
            if (cameraMode3D) {
                const camDist = 14;
                camera.position.x = cuePos.x - Math.sin(aimAngle) * camDist;
                camera.position.z = cuePos.z + Math.cos(aimAngle) * camDist;
                camera.position.y = 12;
                camera.lookAt(cuePos.x, cuePos.y, cuePos.z);
            } else { // 2D Top View
                camera.position.set(0, 24, 0);
                camera.lookAt(0, 0, 0);
            }

            // Stik & Garis Arah Tembakan
            if (canShoot) {
                aimLine.position.copy(cuePos);
                aimLine.rotation.y = aimAngle;

                const cueOffset = 4.8 + (power / 100) * 1.8;
                cueMesh.position.x = cuePos.x - Math.sin(aimAngle) * cueOffset;
                cueMesh.position.z = cuePos.z + Math.cos(aimAngle) * cueOffset;
                cueMesh.position.y = ballRadius + 0.15;
                cueMesh.rotation.y = aimAngle;
            }

            renderer.render(scene, camera);
        }

        // Jalankan Game
        startTimer();
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
