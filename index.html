<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D 8-Ball Pool</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .active-player {
            color: #4CAF50;
            text-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }

        #timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            pointer-events: auto;
        }

        button, select {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: #1e88e5;
            transform: translateY(-2px);
        }

        #power-container {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 200px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #fff;
            pointer-events: auto;
        }

        #power-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #4CAF50, #ff9800, #f44336);
            position: absolute;
            bottom: 0;
            transition: height 0.1s linear;
        }

        #notification {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 10px #000;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-align: center;
        }
    </style>

    <!-- Three.js & Cannon.js untuk Grafik 3D dan Fisika -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="hud-panel">
                <div class="player-info" id="p1-status">P1 (Pemain 1): <span id="p1-score">0</span></div>
                <div class="player-info" id="p2-status">P2 (Komputer/P2): <span id="p2-score">0</span></div>
            </div>
            <div class="hud-panel">
                <div>Waktu Turn: <span id="timer">30</span>s</div>
            </div>
        </div>

        <div id="notification">Giliramu!</div>

        <div id="controls">
            <select id="mode-select" onchange="changeMode(this.value)">
                <option value="ai">Versi Computer (VS AI)</option>
                <option value="pvp">Bermain Berdua (VS Player)</option>
            </select>
            <select id="level-select" onchange="changeLevel(this.value)">
                <option value="easy">Level: Mudah</option>
                <option value="medium" selected>Level: Sedang</option>
                <option value="hard">Level: Sulit</option>
            </select>
            <button onclick="resetGame()">Reset Game</button>
        </div>

        <div id="power-container">
            <div id="power-bar"></div>
        </div>
    </div>

    <script>
        // --- Web Audio API (Efek Suara Sintetis Tanpa Asset Luar) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playHitSound(volume = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playPocketSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- Logika & Variabel Game ---
        let gameMode = 'ai'; // 'ai' atau 'pvp'
        let aiLevel = 'medium';
        let currentPlayer = 1;
        let p1Score = 0, p2Score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let isAiming = false;
        let power = 0;
        let isPowerCharging = false;
        let aimAngle = 0;

        // --- Inisialisasi Three.js & Cannon.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Pencahayaan Realistis
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 20, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Dunia Fisika Cannon.js
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // Material Meja
        const tableGeo = new THREE.BoxGeometry(10, 0.5, 20);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x0a5c36, roughness: 0.4 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.receiveShadow = true;
        scene.add(table);

        const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(5, 0.25, 10)) });
        world.addBody(tableBody);

        // Bola
        const balls = [];
        const ballBodies = [];
        const ballRadius = 0.35;

        function createBall(x, z, color, isWhite = false) {
            const geo = new THREE.SphereGeometry(ballRadius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.1, metalness: 0.1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Sphere(ballRadius);
            const body = new CANNON.Body({ mass: 1, shape: shape });
            body.position.set(x, ballRadius + 0.25, z);
            body.linearDamping = 0.3;
            body.angularDamping = 0.3;

            body.addEventListener("collide", (e) => {
                const relativeVelocity = e.contact.getImpactVelocityAlongNormal();
                if (relativeVelocity > 0.5) {
                    playHitSound(Math.min(relativeVelocity / 10, 1));
                }
            });

            world.addBody(body);
            balls.push(mesh);
            ballBodies.push(body);
            return { mesh, body, isWhite };
        }

        // Bola Putih (Cue Ball)
        const cueBall = createBall(0, 5, 0xffffff, true);

        // Susunan Bola Warna
        const colors = [0xff0000, 0xffff00, 0x0000ff, 0xff00ff, 0xff9800, 0x00ffff, 0x880000, 0x111111];
        let colorIdx = 0;
        for (let row = 0; row < 4; row++) {
            for (let col = 0; col <= row; col++) {
                const x = (col - row / 2) * (ballRadius * 2.2);
                const z = -5 - (row * ballRadius * 2);
                createBall(x, z, colors[colorIdx % colors.length]);
                colorIdx++;
            }
        }

        // Garis Bidik (Aim Line)
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -5)]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const aimLine = new THREE.Line(lineGeo, lineMat);
        scene.add(aimLine);

        // --- Kontrol & Input ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') aimAngle += 0.05;
            if (e.code === 'ArrowRight') aimAngle -= 0.05;
            if (e.code === 'Space' && !isPowerCharging) {
                isPowerCharging = true;
                chargePower();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && isPowerCharging) {
                isPowerCharging = false;
                shootCueBall();
            }
        });

        function chargePower() {
            if (!isPowerCharging) return;
            power = (power + 2) % 100;
            document.getElementById('power-bar').style.height = power + '%';
            requestAnimationFrame(chargePower);
        }

        function shootCueBall() {
            const force = power * 0.25;
            const impulseX = Math.sin(aimAngle) * force;
            const impulseZ = -Math.cos(aimAngle) * force;
            cueBall.body.applyImpulse(new CANNON.Vec3(impulseX, 0, impulseZ), cueBall.body.position);
            power = 0;
            document.getElementById('power-bar').style.height = '0%';
            
            setTimeout(endTurn, 4000); // Ganti giliran setelah bola berhenti
        }

        // --- Manajemen Turn & Timer ---
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    showNotification("Waktu Habis! Berganti Giliran");
                    endTurn();
                }
            }, 1000);
        }

        function endTurn() {
            clearInterval(timerInterval);
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            
            // Highlight pemain aktif
            document.getElementById('p1-status').classList.toggle('active-player', currentPlayer === 1);
            document.getElementById('p2-status').classList.toggle('active-player', currentPlayer === 2);

            if (gameMode === 'ai' && currentPlayer === 2) {
                showNotification("Giliran Komputer...");
                setTimeout(playAITurn, 1500);
            } else {
                showNotification(`Giliran Pemain ${currentPlayer}`);
                startTimer();
            }
        }

        // --- AI Komputer ---
        function playAITurn() {
            let accuracyError = 0;
            if (aiLevel === 'easy') accuracyError = (Math.random() - 0.5) * 0.5;
            if (aiLevel === 'medium') accuracyError = (Math.random() - 0.5) * 0.2;
            if (aiLevel === 'hard') accuracyError = (Math.random() - 0.5) * 0.05;

            // AI membidik ke arah pusat bola target pertama
            const targetBall = ballBodies[1]; 
            const dx = targetBall.position.x - cueBall.body.position.x;
            const dz = targetBall.position.z - cueBall.body.position.z;
            aimAngle = Math.atan2(dx, -dz) + accuracyError;

            power = aiLevel === 'hard' ? 80 : 50;
            shootCueBall();
        }

        // --- Notifikasi & Utilitas UI ---
        function showNotification(text) {
            const el = document.getElementById('notification');
            el.innerText = text;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 2000);
        }

        function changeMode(val) {
            gameMode = val;
            resetGame();
        }

        function changeLevel(val) {
            aiLevel = val;
        }

        function resetGame() {
            cueBall.body.position.set(0, ballRadius + 0.25, 5);
            cueBall.body.velocity.set(0, 0, 0);
            cueBall.body.angularVelocity.set(0, 0, 0);
            currentPlayer = 1;
            p1Score = 0; p2Score = 0;
            document.getElementById('p1-score').innerText = '0';
            document.getElementById('p2-score').innerText = '0';
            startTimer();
        }

        // --- Loop Animasi Render ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);

            // Sinkronkan Posisi Visual 3D dengan Fisika
            for (let i = 0; i < balls.length; i++) {
                balls[i].position.copy(ballBodies[i].position);
                balls[i].quaternion.copy(ballBodies[i].quaternion);

                // Cek jika bola jatuh dari meja (masuk pocket)
                if (ballBodies[i].position.y < 0) {
                    playPocketSound();
                    if (i === 0) { // Bola putih jatuh
                        showNotification("Foul! Bola Putih Masuk");
                        ballBodies[i].position.set(0, ballRadius + 0.25, 5);
                        ballBodies[i].velocity.set(0,0,0);
                    } else {
                        // Tambah skor
                        if (currentPlayer === 1) p1Score += 10; else p2Score += 10;
                        document.getElementById('p1-score').innerText = p1Score;
                        document.getElementById('p2-score').innerText = p2Score;
                        
                        // Sembunyikan bola
                        ballBodies[i].position.set(100, -10, 0); 
                    }
                }
            }

            // Update Garis Arah Pukulan
            aimLine.position.copy(cueBall.mesh.position);
            aimLine.rotation.y = aimAngle;

            renderer.render(scene, camera);
        }

        // Inisialisasi awal
        startTimer();
        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
