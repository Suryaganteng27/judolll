<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 8-Ball Pool Pro - Physics Enhanced</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #08090d;
            color: #fff;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 25px;
        }

        .hud-panel {
            background: rgba(12, 16, 26, 0.88);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .hud-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }

        .player-card.active {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3), rgba(46, 125, 50, 0.5));
            border: 1px solid #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }

        .player-name {
            font-size: 1rem;
            font-weight: 700;
        }

        #timer-box {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff9800;
            min-width: 50px;
            text-align: center;
        }

        #power-container {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 280px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #power-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #4CAF50, #ffeb3b, #f44336);
            border-radius: 10px;
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            margin: auto;
            width: calc(100% - 8px);
            transition: height 0.05s linear;
        }

        #controls-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(12, 16, 26, 0.95);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        button, select {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover, select:hover {
            background: #1e88e5;
            transform: scale(1.05);
        }

        #notification {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 25px rgba(33, 150, 243, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="hud-panel">
                <img src="https://raw.githubusercontent.com/Suryaganteng27/judolll/5ea3a43aa31f3a9c539d8754484e3570d2fbba8c/logo.jpeg" alt="Logo Game" class="hud-logo">
                <div class="player-card active" id="p1-card">
                    <div class="player-name">Pemain 1</div>
                </div>
                <div class="player-card" id="p2-card">
                    <div class="player-name" id="p2-name">Komputer</div>
                </div>
            </div>

            <div class="hud-panel">
                <div id="timer-box">30</div>
                <img src="https://raw.githubusercontent.com/Suryaganteng27/judolll/5ea3a43aa31f3a9c539d8754484e3570d2fbba8c/smkn.jpeg" alt="Logo SMKN" class="hud-logo">
            </div>
        </div>

        <div id="notification">REALISTIC 8-BALL</div>

        <div id="controls-bar">
            <select id="mode-select" onchange="setGameMode(this.value)">
                <option value="ai">VS Komputer (AI)</option>
                <option value="pvp">Bermain Berdua (2 Players)</option>
            </select>
            <select id="level-select" onchange="setAiLevel(this.value)">
                <option value="easy">AI: Mudah</option>
                <option value="medium" selected>AI: Sedang</option>
                <option value="hard">AI: Sulit (Master)</option>
            </select>
            <button onclick="toggleCameraView()">Kamera: <span id="cam-mode-text">3D</span></button>
            <button onclick="resetGame()">Reset Game</button>
        </div>

        <div id="power-container">
            <div id="power-bar"></div>
        </div>
    </div>

    <script>
        // --- Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, intensity = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.07);
                gain.gain.setValueAtTime(Math.min(intensity, 1), audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } else if (type === 'pocket') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- Logika Game ---
        let gameMode = 'ai';
        let aiLevel = 'medium';
        let currentPlayer = 1;
        let timer = 30;
        let timerInterval = null;

        let aimAngle = 0;
        let power = 0;
        let isChargingPower = false;
        let canShoot = true;
        let cameraMode3D = true;

        // --- Scene Three.js & Physics World ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0c12);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 25, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // World Physics
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const ballMaterial = new CANNON.Material("ballMaterial");
        const ballContactMaterial = new CANNON.ContactMaterial(ballMaterial, ballMaterial, {
            friction: 0.1,
            restitution: 0.85
        });
        world.addContactMaterial(ballContactMaterial);

        // --- Meja Biliar dengan Gambar Tekstur ---
        const tableW = 10, tableL = 20;

        const textureLoader = new THREE.TextureLoader();
        const clothTexture = textureLoader.load('https://raw.githubusercontent.com/Suryaganteng27/judolll/5ea3a43aa31f3a9c539d8754484e3570d2fbba8c/loggo.jpeg');

        const tableGeo = new THREE.BoxGeometry(tableW, 0.4, tableL);
        const tableMat = new THREE.MeshStandardMaterial({ map: clothTexture, roughness: 0.25 });
        const tableMesh = new THREE.Mesh(tableGeo, tableMat);
        tableMesh.position.y = -0.2;
        tableMesh.receiveShadow = true;
        scene.add(tableMesh);

        const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(tableW/2, 0.2, tableL/2)) });
        tableBody.position.y = -0.2;
        world.addBody(tableBody);

        // Pockets
        const pocketRadius = 0.65;
        const pockets = [
            { x: -4.6, z: -9.4 }, { x: 4.6, z: -9.4 },
            { x: -4.8, z: 0 },    { x: 4.8, z: 0 },
            { x: -4.6, z: 9.4 },  { x: 4.6, z: 9.4 }
        ];

        pockets.forEach(p => {
            const pGeo = new THREE.CylinderGeometry(pocketRadius, pocketRadius, 0.5, 32);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x030303 });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pMesh.position.set(p.x, -0.01, p.z);
            scene.add(pMesh);
        });

        // Cushions / Dinding
        function createCushion(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, 0.8, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0x221105, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.3, z);
            mesh.castShadow = true;
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w/2, 0.4, d/2)), material: ballMaterial });
            body.position.set(x, 0.3, z);
            world.addBody(body);
        }

        createCushion(-5.3, 0, 0.6, tableL);
        createCushion(5.3, 0, 0.6, tableL);
        createCushion(0, -10.3, tableW, 0.6);
        createCushion(0, 10.3, tableW, 0.6);

        // --- Generator Tekstur Bola Realistis ---
        function createBallTexture(num, color, isStriped) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = isStriped ? '#ffffff' : color;
            ctx.fillRect(0, 0, 256, 128);

            if (isStriped) {
                ctx.fillStyle = color;
                ctx.fillRect(0, 32, 256, 64);
            }

            if (num > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(128, 64, 22, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(num.toString(), 128, 65);
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- Inisialisasi Bola ---
        const ballRadius = 0.32;
        const balls = [];
        const ballBodies = [];

        const ballConfigs = [
            { num: 0, color: '#ffffff', striped: false },
            { num: 1, color: '#ffcc00', striped: false },
            { num: 2, color: '#0022cc', striped: false },
            { num: 3, color: '#cc0000', striped: false },
            { num: 4, color: '#6600cc', striped: false },
            { num: 5, color: '#ff6600', striped: false },
            { num: 6, color: '#008800', striped: false },
            { num: 7, color: '#880000', striped: false },
            { num: 8, color: '#111111', striped: false },
            { num: 9, color: '#ffcc00', striped: true },
            { num: 10, color: '#0022cc', striped: true },
            { num: 11, color: '#cc0000', striped: true },
            { num: 12, color: '#6600cc', striped: true },
            { num: 13, color: '#ff6600', striped: true },
            { num: 14, color: '#008800', striped: true },
            { num: 15, color: '#880000', striped: true }
        ];

        function createBall(x, z, cfg) {
            const texture = createBallTexture(cfg.num, cfg.color, cfg.striped);
            const geo = new THREE.SphereGeometry(ballRadius, 32, 32);
            
            const mat = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.1, 
                metalness: 0.05 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Sphere(ballRadius);
            const body = new CANNON.Body({ 
                mass: 0.17, 
                shape: shape,
                material: ballMaterial 
            });
            body.position.set(x, ballRadius, z);
            body.linearDamping = 0.08; 
            body.angularDamping = 0.08;

            body.addEventListener("collide", (e) => {
                const vel = e.contact.getImpactVelocityAlongNormal();
                if (vel > 0.3) playSound('hit', vel / 6);
            });

            world.addBody(body);
            balls.push({ mesh, body, num: cfg.num });
            ballBodies.push(body);
        }

        // Bola Putih
        createBall(0, 5, ballConfigs[0]);

        // Rak Segitiga Bola
        function rackBalls() {
            let idx = 1;
            const startZ = -4;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c <= r; c++) {
                    const x = (c - r / 2) * (ballRadius * 2.05);
                    const z = startZ - (r * ballRadius * 1.85);
                    createBall(x, z, ballConfigs[idx]);
                    idx++;
                }
            }
        }
        rackBalls();

        // --- Stik Biliar & Garis Pembidik ---
        const cueGeo = new THREE.CylinderGeometry(0.04, 0.09, 9, 16);
        const cueMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.3 });
        const cueMesh = new THREE.Mesh(cueGeo, cueMat);
        cueMesh.rotation.x = Math.PI / 2;
        scene.add(cueMesh);

        const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.3, gapSize: 0.15 });
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-12)]);
        const aimLine = new THREE.Line(lineGeo, lineMat);
        aimLine.computeLineDistances();
        scene.add(aimLine);

        // --- Input Events ---
        window.addEventListener('keydown', (e) => {
            if (!canShoot || (gameMode === 'ai' && currentPlayer === 2)) return;

            if (e.code === 'ArrowLeft') aimAngle += 0.03;
            if (e.code === 'ArrowRight') aimAngle -= 0.03;

            if (e.code === 'Space' && !isChargingPower) {
                isChargingPower = true;
                chargePower();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && isChargingPower) {
                isChargingPower = false;
                shoot();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!canShoot || (gameMode === 'ai' && currentPlayer === 2)) return;
            if (e.buttons === 1) { 
                aimAngle -= e.movementX * 0.004;
            }
        });

        function chargePower() {
            if (!isChargingPower) return;
            power = (power + 2.5) % 100;
            document.getElementById('power-bar').style.height = power + '%';
            requestAnimationFrame(chargePower);
        }

        function shoot() {
            canShoot = false;
            cueMesh.visible = false;
            aimLine.visible = false;

            const force = (power / 100) * 8.5;
            const fx = Math.sin(aimAngle) * force;
            const fz = -Math.cos(aimAngle) * force;

            balls[0].body.applyImpulse(new CANNON.Vec3(fx, 0, fz), balls[0].body.position);
            
            power = 0;
            document.getElementById('power-bar').style.height = '0%';

            setTimeout(checkStopped, 1500);
        }

        function checkStopped() {
            const checkInt = setInterval(() => {
                let stopped = true;
                for (let b of ballBodies) {
                    if (b.velocity.length() > 0.03 || b.angularVelocity.length() > 0.03) {
                        stopped = false;
                        break;
                    }
                }

                if (stopped) {
                    clearInterval(checkInt);
                    switchTurn();
                }
            }, 300);
        }

        // --- Turn Manager ---
        function startTimer() {
            clearInterval(timerInterval);
            timer = 30;
            document.getElementById('timer-box').innerText = timer;

            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer-box').innerText = timer;
                if (timer <= 0) {
                    showNotification("Waktu Habis!");
                    switchTurn();
                }
            }, 1000);
        }

        function switchTurn() {
            clearInterval(timerInterval);
            currentPlayer = currentPlayer === 1 ? 2 : 1;

            document.getElementById('p1-card').classList.toggle('active', currentPlayer === 1);
            document.getElementById('p2-card').classList.toggle('active', currentPlayer === 2);

            canShoot = true;
            cueMesh.visible = true;
            aimLine.visible = true;

            if (gameMode === 'ai' && currentPlayer === 2) {
                showNotification("Giliran Komputer");
                setTimeout(playAI, 1000);
            } else {
                showNotification(`Giliran Pemain ${currentPlayer}`);
                startTimer();
            }
        }

        // --- AI Komputer ---
        function playAI() {
            let error = 0;
            if (aiLevel === 'easy') error = (Math.random() - 0.5) * 0.35;
            if (aiLevel === 'medium') error = (Math.random() - 0.5) * 0.12;
            if (aiLevel === 'hard') error = (Math.random() - 0.5) * 0.02;

            let target = balls[1].body;
            for (let i = 1; i < balls.length; i++) {
                if (balls[i].body.position.y > -0.5) {
                    target = balls[i].body;
                    break;
                }
            }

            const dx = target.position.x - balls[0].body.position.x;
            const dz = target.position.z - balls[0].body.position.z;
            aimAngle = Math.atan2(dx, -dz) + error;

            power = aiLevel === 'hard' ? 70 : 50;
            shoot();
        }

        // --- Helpers ---
        function toggleCameraView() {
            cameraMode3D = !cameraMode3D;
            document.getElementById('cam-mode-text').innerText = cameraMode3D ? "3D" : "2D (Atas)";
        }

        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 1800);
        }

        function setGameMode(v) {
            gameMode = v;
            document.getElementById('p2-name').innerText = v === 'ai' ? "Komputer" : "Pemain 2";
            resetGame();
        }

        function setAiLevel(v) {
            aiLevel = v;
        }

        function resetGame() {
            balls[0].body.position.set(0, ballRadius, 5);
            balls[0].body.velocity.set(0, 0, 0);

            currentPlayer = 1;
            document.getElementById('p1-card').classList.add('active');
            document.getElementById('p2-card').classList.remove('active');

            canShoot = true;
            cueMesh.visible = true;
            aimLine.visible = true;

            showNotification("Mulai Game!");
            startTimer();
        }

        // --- Render Loop & Update ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);

            for (let b of balls) {
                b.mesh.position.copy(b.body.position);
                b.mesh.quaternion.copy(b.body.quaternion);

                pockets.forEach(p => {
                    const dist = Math.hypot(b.body.position.x - p.x, b.body.position.z - p.z);
                    if (dist < pocketRadius && b.body.position.y > -0.5) {
                        playSound('pocket');
                        if (b.num === 0) {
                            showNotification("Foul! Bola Putih Masuk");
                            b.body.position.set(0, ballRadius, 5);
                            b.body.velocity.set(0,0,0);
                        } else {
                            b.body.position.set(100, -10, 0);
                            b.body.velocity.set(0,0,0);
                        }
                    }
                });
            }

            const cuePos = balls[0].mesh.position;
            if (cameraMode3D) {
                const camDist = 13;
                camera.position.x = cuePos.x - Math.sin(aimAngle) * camDist;
                camera.position.z = cuePos.z + Math.cos(aimAngle) * camDist;
                camera.position.y = 11;
                camera.lookAt(cuePos.x, cuePos.y, cuePos.z);
            } else {
                camera.position.set(0, 24, 0);
                camera.lookAt(0, 0, 0);
            }

            if (canShoot) {
                aimLine.position.copy(cuePos);
                aimLine.rotation.y = aimAngle;

                const cueOffset = 4.8 + (power / 100) * 1.8;
                cueMesh.position.x = cuePos.x - Math.sin(aimAngle) * cueOffset;
                cueMesh.position.z = cuePos.z + Math.cos(aimAngle) * cueOffset;
                cueMesh.position.y = ballRadius + 0.15;
                cueMesh.rotation.y = aimAngle;
            }

            renderer.render(scene, camera);
        }

        startTimer();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
